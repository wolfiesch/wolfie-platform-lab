apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD is bootstrapped outside Argo CD (it does not manage itself). Apply with:
#   make argocd-diff    # review
#   make argocd-apply   # server-side apply, same field manager as the original install
# Bump the pinned version here to upgrade; the resource patches carry forward.
namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.4/manifests/install.yaml

# Requests let the scheduler place Argo CD on a multi-node cluster; memory
# limits stop a runaway component from pressuring co-located production
# containers. Sized from observed usage (controller ~120Mi, others <30Mi)
# with headroom for manifest generation spikes. No CPU limits, to avoid
# throttling on an otherwise idle node.
patches:
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 512Mi}}
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
  - target:
      kind: Deployment
      name: argocd-notifications-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
  - target:
      kind: Deployment
      name: argocd-dex-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
